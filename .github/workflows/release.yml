name: Release APK

# Publishes an installable APK as a GitHub release:
# - every push to main makes a "build-N" release
# - pushing a tag such as v0.2.0 makes a release with that name
# - "Run workflow" on the Actions tab makes a "build-N" release from the chosen branch
# The newest release is always at
# https://github.com/kiai-joe/sudoku/releases/latest/download/Sumi.apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags, to list what changed since the last release.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "TITLE=Sumi ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TAG=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "VERSION_NAME=0.1.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "TITLE=Sumi build $GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          # Grows with every run, so each APK installs over the last one.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (a fork, say) the APK keeps the debug key.
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sumi.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sumi.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; signing with the debug key"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          if [[ "$SIGNED" == "true" ]] && grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The signing key was provided but the APK is signed with the debug key"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/sumi.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sumi.apk
          # The notes list what changed since the release before this one.
          previous=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          previous_sha=""
          if [[ -n "$previous" ]]; then previous_sha=$(git rev-list -n 1 "$previous" 2>/dev/null || true); fi
          version_line="Version $VERSION_NAME (code $VERSION_CODE), built from ${GITHUB_SHA::7}."
          if [[ "$SIGNED" == "true" ]]; then version_line="$version_line Signed with Sumi's release key."; fi
          .github/scripts/release-notes.sh "$version_line" "$GITHUB_SHA" "$previous_sha" > notes.md
          # The first build signed with the release key can't install over a debug-signed one.
          if [[ "$SIGNED" == "true" && -n "$previous" ]] && \
              ! gh release view "$previous" --json body --jq '.body' | head -n 1 | grep -q "release key"; then
            cat >> notes.md <<'EOF'

          **This build is signed with Sumi's own release key, so it can't install over an earlier build.** To keep your progress:
          1. In the Sumi you have now, open **Settings › Save a backup file** and save it somewhere you can find.
          2. Uninstall Sumi, then install this build.
          3. Open **Settings › Restore from a backup** and pick the file.

          Builds after this one update normally again.
          EOF
          fi
          gh release create "$TAG" Sumi.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md \
            --latest
