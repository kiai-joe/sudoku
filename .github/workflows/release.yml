name: Release APK

# Publishes an installable APK as a GitHub release:
# - every push to main makes a "build-N" release
# - pushing a tag such as v0.2.0 makes a release with that name
# The newest release is always at
# https://github.com/kiai-joe/sudoku/releases/latest/download/Sumi.apk

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "TITLE=Sumi ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TAG=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "VERSION_NAME=0.1.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "TITLE=Sumi build $GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          # Grows with every run, so each APK installs over the last one.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sumi.apk
          cat > notes.md <<EOF
          Version $VERSION_NAME (code $VERSION_CODE), built from ${GITHUB_SHA::7}.

          **Install:** open this page on your Android phone, tap **Sumi.apk**, and allow "Install unknown apps" for your browser when asked. Newer builds install over older ones and keep your saved game and stats.
          EOF
          gh release create "$TAG" Sumi.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md \
            --latest
